name: Calidad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas-locales:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Revisar Python
        run: python -m ruff check .

      - name: Ejecutar pruebas sin base de datos
        env:
          APP_ENV: TESTING
          SECRET_KEY: ci-testing-only-secret
        run: python -m pytest -m "not integration" --cov --cov-report=term-missing --cov-fail-under=100
