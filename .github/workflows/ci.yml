name: Validación

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: TESTING
      SECRET_KEY: ci-testing-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: bd
      RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Importar esquema base
        run: mysql -h 127.0.0.1 -uroot -proot bd < bd.sql

      - name: Aplicar migración 002
        run: mysql -h 127.0.0.1 -uroot -proot bd < migrations/002_ventas_variantes_cancelacion.sql

      - name: Aplicar migración 003
        run: mysql -h 127.0.0.1 -uroot -proot bd < migrations/003_estabilidad_auditoria.sql

      - name: Validar registro de migraciones
        run: python scripts/apply_migrations.py

      - name: Validar migraciones repetibles
        run: python scripts/apply_migrations.py --dry-run

      - name: Validar Python
        run: ruff check .

      - name: Validar JavaScript
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Probar redirección de recuperación
        continue-on-error: true
        run: pytest tests/test_app_security.py::test_password_reset_final_step_redirects_without_verified_state

      - name: Probar destino de recuperación
        continue-on-error: true
        run: pytest tests/test_app_security.py::test_password_reset_final_step_returns_to_recovery_start

      - name: Probar permisos de empleados
        continue-on-error: true
        run: pytest tests/test_app_security.py::test_employee_cannot_read_another_user

      - name: Probar validación de PDF
        continue-on-error: true
        run: pytest tests/test_app_security.py::test_invalid_pdf_signature_is_rejected

      - name: Probar protección CSRF
        continue-on-error: true
        run: pytest tests/test_app_security.py::test_write_api_rejects_missing_csrf_token

      - name: Probar encabezados de seguridad
        continue-on-error: true
        run: pytest tests/test_app_security.py::test_security_headers_are_present

      - name: Probar configuración de base de datos
        run: pytest tests/test_database_config.py

      - name: Probar migraciones y saneamiento
        run: pytest tests/test_migrations_and_secrets.py

      - name: Probar integridad de ventas
        run: pytest tests/test_sales_integrity.py

      - name: Verificar cobertura unitaria
        run: pytest -m "not integration" --cov=. --cov-report=term-missing --cov-fail-under=35

      - name: Verificar versiones del esquema
        run: pytest tests/test_database_integration.py::test_required_schema_versions_are_applied

      - name: Verificar columnas requeridas
        run: pytest tests/test_database_integration.py::test_required_schema_columns_exist
